name: Prepare experimental React candidates
on:
  workflow_dispatch:
    inputs:
      family:
        description: Package family
        type: choice
        options: [both, martlet, krigsvold]
        default: both
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      WORKBENCH_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
      - run: npm run test:packages
  prepare:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/prepare-release.mjs "$RELEASE_FAMILY"
        env:
          RELEASE_FAMILY: ${{ inputs.family }}
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-react-candidates
          path: release-candidates/
          if-no-files-found: error
