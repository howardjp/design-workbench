name: Publish experimental React packages
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: experimental-react-publication
  cancel-in-progress: false
jobs:
  verify:
    if: startsWith(github.event.release.tag_name, 'react-v') && github.event.release.prerelease
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      WORKBENCH_BROWSER: ${{ matrix.browser }}
      DESIGN_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node scripts/check-react-release.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: git merge-base --is-ancestor HEAD origin/main
      - run: npm run check
      - name: Use the Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 10
      - run: npm run test:browser
      - run: npm run test:reference
      - run: npm run test:packages
      - run: npm run test:agents
      - run: npm run build:plugins
      - run: git diff --exit-code -- plugins
      - run: npm run build:hosted
  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family: [martlet, krigsvold]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace "@$RELEASE_FAMILY/react"
        env:
          RELEASE_FAMILY: ${{ matrix.family }}
      - run: npm publish --workspace "@$RELEASE_FAMILY/react" --access public --tag next --provenance
        env:
          RELEASE_FAMILY: ${{ matrix.family }}
