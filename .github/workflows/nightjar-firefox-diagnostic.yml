name: Nightjar Firefox diagnostic
on:
  pull_request:
    branches: [nightjar2/forms-stress]
    paths:
      - examples/page-archetypes/tests/form-stale-validity.mjs
      - .github/workflows/nightjar-firefox-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [headless, headed]
    env:
      BUNDLE_FROZEN: 'true'
      NIGHTJAR_BROWSER: firefox
      NIGHTJAR_TEST_FAMILY: martlet
      NIGHTJAR_TEST_FRAMEWORK: jekyll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: npm ci --ignore-scripts
      - run: cd examples/jekyll/martlet && bundle install
      - run: npx playwright install --with-deps firefox
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool imagemagick
      - run: |
          if [ '${{ matrix.mode }}' = headed ]; then
            NIGHTJAR_HEADED=1 xvfb-run -a node examples/page-archetypes/tests/form-stale-validity.mjs
          else
            node examples/page-archetypes/tests/form-stale-validity.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.mode == 'headed'
        with:
          name: nightjar-firefox-native-ui
          path: ${{ runner.temp }}/nightjar-*.png
          if-no-files-found: ignore
      - name: Inspect native screenshot
        if: failure() && matrix.mode == 'headed'
        run: |
          if [ -f "$RUNNER_TEMP/nightjar-before.png" ]; then
            printf 'NIGHTJAR_BEFORE_BEGIN'
            base64 -w0 "$RUNNER_TEMP/nightjar-before.png"
            printf 'NIGHTJAR_BEFORE_END\n'
          fi
