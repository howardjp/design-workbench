name: Verify portable examples
on:
  pull_request:
    paths: ['examples/**', 'packages/**', 'package.json', 'package-lock.json', 'playwright.dashboard.config.ts', '.github/workflows/jekyll-examples.yml']
  push:
    branches: [main]
    paths: ['examples/**', 'packages/**', 'package.json', 'package-lock.json', 'playwright.dashboard.config.ts', '.github/workflows/jekyll-examples.yml']
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: npm ci --ignore-scripts
      - name: Check canonical exports and portable contracts
        run: |
          python3 examples/page-archetypes/scripts/sync.py
          git diff --exit-code -- examples/jekyll
          node examples/page-archetypes/scripts/verify.mjs
          node --test examples/page-archetypes/tests/dashboard-model.test.mjs
      - name: Install locked Jekyll dependencies
        run: |
          cd examples/jekyll/martlet && bundle install
          cd ../krigsvold && bundle install
      - name: Build and verify root-hosted references
        run: |
          python3 examples/page-archetypes/scripts/build.py
          python3 examples/page-archetypes/scripts/verify-html.py examples/jekyll/martlet/dist
          python3 examples/page-archetypes/scripts/verify-html.py examples/jekyll/krigsvold/dist
      - name: Build and verify subpath-hosted references
        run: |
          python3 examples/page-archetypes/scripts/build.py --family martlet --baseurl /preview --destination "$RUNNER_TEMP/martlet-subpath"
          python3 examples/page-archetypes/scripts/verify-html.py "$RUNNER_TEMP/martlet-subpath" --baseurl /preview
          python3 examples/page-archetypes/scripts/build.py --family krigsvold --baseurl /preview --destination "$RUNNER_TEMP/krigsvold-subpath"
          python3 examples/page-archetypes/scripts/verify-html.py "$RUNNER_TEMP/krigsvold-subpath" --baseurl /preview
      - name: Build paired application test fixtures
        run: |
          python3 examples/page-archetypes/scripts/build.py --family martlet --baseurl /martlet --destination "$GITHUB_WORKSPACE/dashboard-test-dist/martlet"
          python3 examples/page-archetypes/scripts/build.py --family krigsvold --baseurl /krigsvold --destination "$GITHUB_WORKSPACE/dashboard-test-dist/krigsvold"
      - name: Install browser for dashboard acceptance checks
        run: npx playwright install --with-deps chromium
      - name: Verify Jekyll search index serialization
        run: npm run test:search-safety
      - name: Verify paired dashboard behaviour, reflow, keyboard and accessibility
        run: npx playwright test --config playwright.dashboard.config.ts
      - name: Verify independent station and scene compositions
        run: |
          npm ci --prefix examples/astro-slice --ignore-scripts
          npm --prefix examples/astro-slice run test:fixtures
          node examples/page-archetypes/tests/simulation-composition.mjs
          node examples/page-archetypes/tests/gallery-composition.mjs
          node examples/page-archetypes/tests/chat-composition.mjs
      - name: Verify multilingual long-content reflow across frameworks
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          export NIGHTJAR_JEKYLL_ROOT="$RUNNER_TEMP/nightjar-i18n"
          python3 examples/page-archetypes/scripts/build.py --family martlet --destination "$NIGHTJAR_JEKYLL_ROOT/martlet"
          python3 examples/page-archetypes/scripts/build.py --family krigsvold --destination "$NIGHTJAR_JEKYLL_ROOT/krigsvold"
          NIGHTJAR_FAMILY=martlet NIGHTJAR_BASE=/ npm --prefix examples/astro-slice run build
          NIGHTJAR_FAMILY=krigsvold NIGHTJAR_BASE=/ npm --prefix examples/astro-slice run build
          npm run build --workspaces
          NIGHTJAR_FAMILY=martlet NIGHTJAR_BASE=/ node examples/react-catalog/build.mjs
          NIGHTJAR_FAMILY=krigsvold NIGHTJAR_BASE=/ node examples/react-catalog/build.mjs
          node examples/page-archetypes/tests/dashboard-framework-parity.mjs
          node examples/page-archetypes/tests/content-semantic-inventory.mjs
          node examples/page-archetypes/tests/dashboard-static-chart-data.mjs
          node examples/page-archetypes/tests/form-keyboard-parity.mjs
          node examples/page-archetypes/tests/reading-framework-typography.mjs
          node examples/page-archetypes/tests/internationalization-stress.mjs
          node examples/page-archetypes/tests/enlarged-text-motion.mjs
          node examples/page-archetypes/tests/gallery-link-contract.mjs
          node examples/page-archetypes/tests/dense-table-reflow.mjs
          node examples/page-archetypes/tests/search-history-state.mjs
          node examples/page-archetypes/tests/form-composition.mjs
          node examples/page-archetypes/tests/workspace-composition.mjs
          node examples/page-archetypes/tests/search-composition.mjs
      # These suites rebuild their own root/subpath output, so run them after
      # checks that consume the root-path builds above.
      - name: Verify Astro and React source shells and React compositions
        timeout-minutes: 10
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          (cd examples/astro-slice && node test-source-shell.mjs)
          node examples/react-catalog/test-source-shell.mjs
          node examples/react-catalog/test-gallery.mjs
          node examples/react-catalog/test-simulation.mjs
          node examples/react-catalog/test-workspace-chat.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-evidence
          path: test-results/dashboards
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: jekyll-example-sites
          path: |
            examples/jekyll/martlet/dist
            examples/jekyll/krigsvold/dist

  # Group the expensive isolated builds to bound parallelism and setup cost.
  fixture-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [analytics-coverage, analytics-precision, operations-directory]
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install locked dependencies and build React workspaces
        run: |
          npm ci --ignore-scripts
          npm ci --prefix examples/astro-slice --ignore-scripts
          npm run build --workspaces
          (cd examples/jekyll/martlet && bundle install)
          (cd examples/jekyll/krigsvold && bundle install)
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise isolated schema-valid fixtures
        env:
          NIGHTJAR_FIXTURE_SUITE: ${{ matrix.suite }}
        run: |
          case "$NIGHTJAR_FIXTURE_SUITE" in
            analytics-coverage)
              node examples/page-archetypes/tests/analytics-empty.mjs
              node examples/page-archetypes/tests/analytics-order-static.mjs
              node examples/page-archetypes/tests/analytics-sparse.mjs
              node examples/page-archetypes/tests/analytics-sparse.mjs --gap
              ;;
            analytics-precision)
              node examples/page-archetypes/tests/analytics-precision.mjs
              node examples/page-archetypes/tests/analytics-precision.mjs --previous
              node examples/page-archetypes/tests/analytics-precision.mjs --selection
              ;;
            operations-directory)
              node examples/page-archetypes/tests/operations-order.mjs
              node examples/page-archetypes/tests/operations-partial.mjs
              node examples/page-archetypes/tests/operations-partial.mjs --disjoint
              node examples/page-archetypes/tests/operations-invalid.mjs
              node examples/page-archetypes/tests/operations-invalid.mjs --future
              node examples/page-archetypes/tests/administration-identifiers.mjs
              ;;
            *) exit 1 ;;
          esac
